name: Linux build

# Builds only: Debian packages for amd64 and arm64 (Raspberry Pi 4/5). Uploads a
# workflow artifact and never creates a release. Trigger:
#
#   git tag linux-v<__version__> && git push origin linux-v<__version__>

on:
  push:
    tags:
      - "linux-v*"
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            arch: amd64
          - runner: ubuntu-22.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 \
            libfontconfig1 libdbus-1-3 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 \
            libxcb-shape0 libxcb-xinerama0 libxcb-randr0 libxcb-render-util0 libxcb-image0

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --only-binary=pikepdf -r requirements.txt
          pip install pyinstaller pytest

      - name: Run the test suite
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest tests -q

      - name: Build the .deb
        run: python packaging/build_deb.py

      - name: Check the package
        run: |
          set -euo pipefail
          VERSION=$(python -c "import re;print(re.search(r'__version__\s*=\s*\"([^\"]+)\"',open('khervepdf/__init__.py').read()).group(1))")
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          case "$GITHUB_REF_NAME" in linux-v*) test "linux-v$VERSION" = "$GITHUB_REF_NAME" ;; esac
          dpkg-deb --info "dist/KhervePDF_${VERSION}_${{ matrix.arch }}.deb"
          ls -lh dist/*.deb

      - name: Smoke-test the frozen app
        run: python packaging/smoke_test.py dist/KhervePDF/KhervePDF

      - name: Install the .deb, smoke-test the installed app, remove it
        run: |
          set -euo pipefail
          sudo apt-get install -y "./dist/KhervePDF_${VERSION}_${{ matrix.arch }}.deb"
          test -x /usr/bin/khervepdf
          test -f /usr/share/applications/khervepdf.desktop
          python packaging/smoke_test.py /opt/khervepdf/KhervePDF
          sudo apt-get remove -y khervepdf
          test ! -e /opt/khervepdf/KhervePDF
          echo "install / run / remove OK"

      - name: Upload the .deb
        uses: actions/upload-artifact@v4
        with:
          name: KhervePDF-${{ env.VERSION }}-linux-${{ matrix.arch }}
          path: |
            dist/KhervePDF_*_${{ matrix.arch }}.deb
            dist/KhervePDF-linux-${{ matrix.arch }}.deb
          if-no-files-found: error
