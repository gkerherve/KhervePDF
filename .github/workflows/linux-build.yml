name: Linux build

# Builds only: PyInstaller one-folder packed as a tar.gz (x86_64). Uploads a
# workflow artifact and never creates a release. Trigger:
#
#   git tag linux-v<__version__> && git push origin linux-v<__version__>

on:
  push:
    tags:
      - "linux-v*"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 \
            libfontconfig1 libdbus-1-3 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 \
            libxcb-shape0 libxcb-xinerama0 libxcb-randr0 libxcb-render-util0 libxcb-image0

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --only-binary=pikepdf -r requirements.txt
          pip install pyinstaller pytest

      - name: Run the test suite
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest tests -q

      - name: Freeze
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m PyInstaller KhervePDF.spec --noconfirm --clean

      - name: Pack the tarball
        run: |
          set -euo pipefail
          VERSION=$(python -c "import re;print(re.search(r'__version__\s*=\s*\"([^\"]+)\"',open('khervepdf/__init__.py').read()).group(1))")
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          case "$GITHUB_REF_NAME" in linux-v*) test "linux-v$VERSION" = "$GITHUB_REF_NAME" ;; esac
          test -x dist/KhervePDF/KhervePDF
          cp packaging/icons/khervepdf_256.png dist/KhervePDF/khervepdf.png
          printf '[Desktop Entry]\nType=Application\nName=KhervePDF\nComment=PDF editor\nExec=KhervePDF %%f\nIcon=khervepdf\nMimeType=application/pdf;\nCategories=Office;Viewer;\n' > dist/KhervePDF/KhervePDF.desktop
          tar -C dist -czf "dist/KhervePDF-$VERSION-linux-x86_64.tar.gz" KhervePDF
          cp "dist/KhervePDF-$VERSION-linux-x86_64.tar.gz" dist/KhervePDF-linux-x86_64.tar.gz
          (cd dist && sha256sum KhervePDF-*linux-x86_64.tar.gz > KhervePDF-linux-x86_64.sha256)
          ls -lh dist/*.tar.gz

      - name: Smoke-test the frozen app
        run: python packaging/smoke_test.py dist/KhervePDF/KhervePDF

      - name: Upload the tarball
        uses: actions/upload-artifact@v4
        with:
          name: KhervePDF-${{ env.VERSION }}-linux-x86_64
          path: |
            dist/KhervePDF-*linux-x86_64.tar.gz
            dist/KhervePDF-linux-x86_64.sha256
          if-no-files-found: error
